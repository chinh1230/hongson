<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Hồ sơ Học sinh</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 24px; color: #333; }
    .container { max-width: 1200px; margin: auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    h1 { margin-top: 0; font-size: 22px; color: #1e293b; display: flex; justify-content: space-between; align-items: center; }
    
    /* Thanh công cụ & Lọc */
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0; align-items: center; }
    .input-field { padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
    .input-field:focus { border-color: #2563eb; ring: 2px solid #bfdbfe; }
    .btn { padding: 9px 16px; border: none; border-radius: 6px; font-weight: 500; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #475569; }

    /* Bảng dữ liệu */
    .table-responsive { overflow-x: auto; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th, td { padding: 12px 14px; border-bottom: 1px solid #e2e8f0; }
    th { background: #f8fafc; color: #475569; font-weight: 600; }
    tr:hover { background-color: #f1f5f9; }

    /* Badge trạng thái */
    .badge { padding: 4px 8px; border-radius: 9999px; font-size: 12px; font-weight: 600; display: inline-block; }
    .badge-luuban { background-color: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
    .badge-noikhac { background-color: #fef3c7; color: #d97706; border: 1px solid #fcd34d; }
    .badge-binhthuong { background-color: #ecfdf5; color: #059669; }

    /* Modal Form */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: #fff; padding: 24px; border-radius: 10px; width: 100%; max-width: 520px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    .form-group input, .form-group select { width: 100%; }
    .checkbox-group { display: flex; gap: 20px; margin: 16px 0; padding: 10px 14px; background: #f8fafc; border-radius: 8px; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
    .checkbox-label input { width: auto; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <h1>
    Quản lý danh sách học sinh
    <button class="btn btn-primary" onclick="moModalThemMoi()">+ Thêm phiếu mới</button>
  </h1>

  <!-- Thanh lọc dữ liệu -->
  <div class="toolbar">
    <!-- Lọc lớp chính xác tuyệt đối -->
    <input type="text" id="locLop" class="input-field" placeholder="Lọc đúng Lớp (VD: 1, 5A2)..." oninput="taiBangDuLieu()">
    
    <input type="text" id="locTen" class="input-field" placeholder="Tìm theo tên học sinh..." oninput="taiBangDuLieu()">
    
    <select id="locTrangThai" class="input-field" onchange="taiBangDuLieu()">
      <option value="">-- Tất cả trạng thái --</option>
      <option value="luuBan">Chỉ học sinh Lưu ban</option>
      <option value="hocNoiKhac">Chỉ học sinh Học nơi khác</option>
    </select>

    <button class="btn btn-secondary" onclick="datLaiBoLoc()">Đặt lại bộ lọc</button>
  </div>

  <!-- Bảng hiển thị danh sách -->
  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>Mã HS</th>
          <th>Họ và Tên</th>
          <th>Lớp</th>
          <th>Ngày sinh</th>
          <th>Trạng thái đặc biệt</th>
          <th>Ghi chú</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody id="bangHocSinh"></tbody>
    </table>
  </div>
</div>

<!-- Modal Thêm / Chỉnh sửa đầy đủ cột -->
<div class="modal" id="modalForm">
  <div class="modal-content">
    <h2 id="modalTieuDe" style="margin-top: 0; font-size: 18px;">Thêm học sinh mới</h2>
    <form id="formHocSinh" onsubmit="xuLyLuu(event)">
      <input type="hidden" id="editIndex">

      <div class="form-group">
        <label>Mã định danh / STT:</label>
        <input type="text" id="inpMa" class="input-field" required placeholder="VD: HS01">
      </div>

      <div class="form-group">
        <label>Họ và Tên:</label>
        <input type="text" id="inpTen" class="input-field" required placeholder="Nguyễn Văn A">
      </div>

      <div style="display: flex; gap: 12px;">
        <div class="form-group" style="flex: 1;">
          <label>Lớp:</label>
          <input type="text" id="inpLop" class="input-field" required placeholder="VD: 1 hoặc 5A2">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Ngày sinh:</label>
          <input type="date" id="inpNgaySinh" class="input-field">
        </div>
      </div>

      <!-- 2 Ô TÍCH CHỌN LƯU BAN VÀ HỌC NƠI KHÁC -->
      <div class="checkbox-group">
        <label class="checkbox-label" style="color: #dc2626; font-weight: 600;">
          <input type="checkbox" id="chkLuuBan"> Lưu ban
        </label>
        <label class="checkbox-label" style="color: #d97706; font-weight: 600;">
          <input type="checkbox" id="chkHocNoiKhac"> Học nơi khác
        </label>
      </div>

      <div class="form-group">
        <label>Ghi chú chuyển lớp / thông tin khác:</label>
        <input type="text" id="inpGhiChu" class="input-field" placeholder="Ghi chú thêm...">
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
        <button type="button" class="btn btn-secondary" onclick="dongModal()">Hủy</button>
        <button type="submit" class="btn btn-primary">Lưu thông tin</button>
      </div>
    </form>
  </div>
</div>

<script>
  const STORAGE_KEY = 'DANH_SACH_HOC_SINH_APP';

  // 1. Khởi tạo dữ liệu từ LocalStorage (chống mất khi F5)
  let danhSachHocSinh = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
    { ma: 'HS01', ten: 'Trần Văn An', lop: '1', ngaySinh: '2019-05-12', luuBan: false, hocNoiKhac: false, ghiChu: '' },
    { ma: 'HS02', ten: 'Lê Hoàng Bách', lop: '10', ngaySinh: '2010-02-18', luuBan: true, hocNoiKhac: false, ghiChu: 'Chờ xét chuyển lớp' },
    { ma: 'HS03', ten: 'Nguyễn Thị Cúc', lop: '1', ngaySinh: '2019-09-21', luuBan: false, hocNoiKhac: true, ghiChu: 'Tạm gửi học cơ sở 2' }
  ];

  function luuVaoLocalStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(danhSachHocSinh));
  }

  // 2. Hiển thị dữ liệu lên bảng & Thuật toán lọc
  function taiBangDuLieu() {
    const tbody = document.getElementById('bangHocSinh');
    const locLop = document.getElementById('locLop').value.trim();
    const locTen = document.getElementById('locTen').value.toLowerCase().trim();
    const locTrangThai = document.getElementById('locTrangThai').value;

    tbody.innerHTML = '';

    const duLieuLoc = danhSachHocSinh.filter(item => {
      // LỌC CHÍNH XÁC TUYỆT ĐỐI THEO LỚP:
      // Nếu nhập "1", chỉ khớp đúng "1", không khớp "10", "11", "21"
      if (locLop !== '' && item.lop.toString().trim() !== locLop) {
        return false;
      }

      // Lọc theo tên (chứa chuỗi ký tự)
      if (locTen !== '' && !item.ten.toLowerCase().includes(locTen)) {
        return false;
      }

      // Lọc theo cờ Lưu ban / Học nơi khác
      if (locTrangThai === 'luuBan' && !item.luuBan) return false;
      if (locTrangThai === 'hocNoiKhac' && !item.hocNoiKhac) return false;

      return true;
    });

    if (duLieuLoc.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #94a3b8; padding: 24px;">Không tìm thấy học sinh nào phù hợp.</td></tr>`;
      return;
    }

    duLieuLoc.forEach((hs) => {
      const realIndex = danhSachHocSinh.findIndex(item => item.ma === hs.ma);
      
      // Tạo nhãn trực quan
      let badges = [];
      if (hs.luuBan) badges.push('<span class="badge badge-luuban">Lưu ban</span>');
      if (hs.hocNoiKhac) badges.push('<span class="badge badge-noikhac">Học nơi khác</span>');
      if (badges.length === 0) badges.push('<span class="badge badge-binhthuong">Bình thường</span>');

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${hs.ma}</strong></td>
        <td>${hs.ten}</td>
        <td><strong>${hs.lop}</strong></td>
        <td>${hs.ngaySinh || '-'}</td>
        <td>${badges.join(' ')}</td>
        <td>${hs.ghiChu || '-'}</td>
        <td>
          <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 12px;" onclick="moModalSua(${realIndex})">Sửa</button>
          <button class="btn btn-danger" style="padding: 4px 8px; font-size: 12px;" onclick="xoaHocSinh(${realIndex})">Xóa</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // 3. Modal Form: Thêm mới & Chỉnh sửa
  function moModalThemMoi() {
    document.getElementById('modalTieuDe').textContent = 'Thêm phiếu học sinh mới';
    document.getElementById('formHocSinh').reset();
    document.getElementById('editIndex').value = '-1';
    document.getElementById('modalForm').classList.add('active');
  }

  function moModalSua(index) {
    const hs = danhSachHocSinh[index];
    document.getElementById('modalTieuDe').textContent = 'Chỉnh sửa thông tin học sinh';
    document.getElementById('editIndex').value = index;
    document.getElementById('inpMa').value = hs.ma;
    document.getElementById('inpTen').value = hs.ten;
    document.getElementById('inpLop').value = hs.lop;
    document.getElementById('inpNgaySinh').value = hs.ngaySinh || '';
    document.getElementById('chkLuuBan').checked = !!hs.luuBan;
    document.getElementById('chkHocNoiKhac').checked = !!hs.hocNoiKhac;
    document.getElementById('inpGhiChu').value = hs.ghiChu || '';
    document.getElementById('modalForm').classList.add('active');
  }

  function dongModal() {
    document.getElementById('modalForm').classList.remove('active');
  }

  // 4. Lưu dữ liệu (Thêm hoặc Cập nhật)
  function xuLyLuu(event) {
    event.preventDefault();
    const index = parseInt(document.getElementById('editIndex').value, 10);
    
    const duLieuMoi = {
      ma: document.getElementById('inpMa').value.trim(),
      ten: document.getElementById('inpTen').value.trim(),
      lop: document.getElementById('inpLop').value.trim(),
      ngaySinh: document.getElementById('inpNgaySinh').value,
      luuBan: document.getElementById('chkLuuBan').checked,
      hocNoiKhac: document.getElementById('chkHocNoiKhac').checked,
      ghiChu: document.getElementById('inpGhiChu').value.trim()
    };

    if (index === -1) {
      danhSachHocSinh.push(duLieuMoi);
    } else {
      danhSachHocSinh[index] = duLieuMoi;
    }

    luuVaoLocalStorage();
    dongModal();
    taiBangDuLieu();
  }

  function xoaHocSinh(index) {
    if (confirm(`Bạn có chắc chắn muốn xóa học sinh ${danhSachHocSinh[index].ten}?`)) {
      danhSachHocSinh.splice(index, 1);
      luuVaoLocalStorage();
      taiBangDuLieu();
    }
  }

  function datLaiBoLoc() {
    document.getElementById('locLop').value = '';
    document.getElementById('locTen').value = '';
    document.getElementById('locTrangThai').value = '';
    taiBangDuLieu();
  }

  // Tải dữ liệu ban đầu khi trang vừa load
  taiBangDuLieu();
</script>
</body>
</html>
